<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#eef6fd">
<title>پیام‌رسان</title>
<style>
:root{--brand:#4aa3e8;--bg:#fff;--card:#fff;--hd:#eef6fd;--line:#dde9f4;--mine:#d3e8fb;--other:#fff;--text:#1c2733;--muted:#7d8d9b;--danger:#d93a3a;--inp:#f1f6fb;--blend:normal;--cbg:#e4f0fd}
[data-theme=dark]{--brand:#6bb6f0;--hd:#17212b;--bg:#0f1720;--card:#17212b;--line:#243241;--mine:#2b5278;--other:#1f2d3b;--text:#e8eef4;--muted:#8a9aa8;--inp:#0f1720;--blend:multiply;--cbg:#1b2733}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:Vazirmatn,Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:var(--inp);color:var(--text);outline:none}
input:focus{border-color:var(--brand)}
input.ltr{direction:ltr;text-align:left}
.btn{width:100%;margin-top:16px;padding:12px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:bold;font-size:15px}
.btn.sec{background:var(--inp);color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.6}
.ib{border:0;background:none;color:var(--muted);padding:0 2px;display:inline-flex;opacity:.75}.ib:hover{opacity:1;color:var(--brand)}svg{flex-shrink:0}
.flip{display:block}[dir=rtl] .flip{transform:scaleX(-1)}
.av{border-radius:50%;object-fit:cover;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0}
#auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);width:100%;max-width:380px;border-radius:18px;padding:24px;box-shadow:0 6px 24px rgba(0,0,0,.1)}
.card h1{margin:0 0 4px;font-size:22px;color:var(--brand);text-align:center}
.sub{margin:0 0 16px;text-align:center;color:var(--muted);font-size:13px}
.tabs{display:flex;background:var(--inp);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--brand);font-weight:bold;box-shadow:0 1px 4px rgba(0,0,0,.12)}
label{display:block;font-size:13px;margin:12px 0 5px;color:var(--muted)}
#err{margin-top:10px;color:var(--danger);font-size:13px;text-align:center;min-height:18px}
#app{height:100dvh;display:flex}
#side{width:100%;display:flex;flex-direction:column;background:var(--card)}
#room{display:none;flex:1;flex-direction:column;min-width:0}
#app.open #side{display:none}#app.open #room{display:flex}
.hd{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--hd);border-bottom:1px solid var(--line)}
.hd .t{flex:1;min-width:0}.hd .t b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd .t small{color:var(--muted);font-size:12px}
.hd button.i{background:none;border:0;color:var(--brand);width:38px;height:38px;display:flex;align-items:center;justify-content:center}
#convs{flex:1;overflow-y:auto}
.conv{display:flex;align-items:center;gap:12px;padding:9px 14px;cursor:pointer}
.conv:active,.conv.on{background:var(--inp)}
.conv b{display:block;font-size:15px;font-weight:600}.conv small{color:var(--muted);font-size:12px}
#fab{position:absolute;bottom:20px;inset-inline-end:20px;width:56px;height:56px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(74,163,232,.45)}
#side{position:relative}

.msg{max-width:80%;padding:6px 10px 4px;border-radius:16px 16px 16px 4px;background:var(--other);box-shadow:0 1px 1.5px rgba(0,0,0,.1);align-self:flex-start;overflow-wrap:anywhere;direction:rtl}
[dir=ltr] .msg{direction:ltr}
.msg.mine{background:var(--mine);align-self:flex-end;border-radius:16px 16px 4px 16px}
.msg.mine .ck{color:var(--brand)}
.msg .name{font-size:12px;font-weight:bold;color:var(--brand)}
.msg .txt{font-size:15px;line-height:1.7;white-space:pre-wrap}
.msg .meta{display:flex;gap:4px;align-items:center;justify-content:flex-end;font-size:10px;color:var(--muted)}
.empty{direction:rtl;background:var(--other);padding:6px 14px;border-radius:14px;margin:auto;color:var(--muted);font-size:14px}
#editbar{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--card);border-top:1px solid var(--line);font-size:13px;color:var(--brand)}
#editbar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#send{display:flex;align-items:center;gap:6px;padding:6px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
#send input{flex:1;border:0;background:transparent;padding:11px 8px;font-size:16px}
#sendBtn{width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f4b400;margin-inline-end:5px}.dot.ok{background:#4cd964}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:420px;max-height:88dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.drawer{align-self:stretch;margin-inline-end:auto;border-radius:0;width:290px;max-height:none;padding:0}
.mi{color:var(--text);display:flex;align-items:center;gap:16px;width:100%;padding:13px 16px;border:0;background:none;text-align:start;font-size:15px}
.mi:active{background:var(--inp)}.mi>svg{color:var(--muted)}
.logo{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center}
.mh{padding:20px 16px;background:linear-gradient(135deg,#7cc0f2,#4aa3e8);color:#fff;padding-top:max(20px,env(safe-area-inset-top))}
.mh b{display:block;margin-top:8px}.mh small{opacity:.85;direction:ltr;display:block;text-align:start}
.row{display:flex;gap:8px}.row .btn{margin-top:8px}
.ur{display:flex;align-items:center;gap:12px;padding:8px 4px;cursor:pointer}
.ur input{width:auto}
@media(min-width:800px){#side{width:340px;display:flex!important;border-inline-end:1px solid var(--line);flex:none}#room{display:flex}.bk{display:none}.ov{align-items:center}.sheet{border-radius:18px}.drawer{border-radius:0;align-self:stretch}}

<body>
<div id="auth" hidden>
  <div class="card">
    <div class="logo"></div>
    <h1 data-i="appname"></h1>
    <p class="sub" data-i="authsub"></p>

    <form id="authForm">
      <div id="nameRow" hidden><label for="username" data-i="uname_hint"></label><input id="username" maxlength="20" autocomplete="username"></div>
      <label for="email" data-i="email"></label><input id="email" type="email" class="ltr" required autocomplete="email">
      <label for="password" data-i="pass"></label><input id="password" type="password" class="ltr" required minlength="6">

      <button id="authBack" class="btn sec" type="button" hidden data-i="cancel"></button>

</div>

<div id="app" hidden>
  <aside id="side">
    <div class="hd"><button class="i" id="menuBtn" aria-label="menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="t"><b data-i="appname"></b></div></div>

  </aside>

    <div class="hd">
      <button class="i bk" id="back"><svg class="flip" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <div id="hav"></div>
      <div class="t"><b id="htitle"></b><small><span id="dot" class="dot"></span><span id="hsub"></span></small></div>
    </div>
    <div id="list"></div>
    <div id="editbar" hidden><span id="edtxt"></span><button class="ib" id="edcancel"></button></div>
    <form id="send" autocomplete="off">
      <input id="text" data-p="msg_ph" maxlength="2000">
      <button id="sendBtn" type="submit"><svg class="flip" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
    </form>
  </section>
</div>
<div id="ov" class="ov" hidden><div id="sheet" class="sheet"></div></div>

<script>

const IC = {
 edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',

 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',

const T = {
fa:{appname:'پیام‌رسان',authsub:'برای شروع وارد شو یا ثبت‌نام کن',login:'ورود',signup:'ثبت‌نام',mkacc:'ساخت حساب',email:'ایمیل',pass:'رمز عبور (حداقل ۶ حرف)',uname_hint:'نام کاربری (۳ تا ۲۰ حرف، فارسی یا انگلیسی)',cancel:'انصراف',msg_ph:'پیام بنویس…',public:'گفتگوی عمومی',group:'گروه',private:'چت شخصی',pub_sub:'همه کاربران',edited:'ویرایش‌شده',editing:'ویرایش پیام',del_q:'این پیام حذف شود؟',empty:'هنوز پیامی نیست.',profile:'ویرایش پروفایل',dark:'حالت تاریک',light:'حالت روشن',lang:'زبان',addacc:'افزودن حساب کاربری',logout:'خروج از حساب',newchat:'گفت‌وگوی جدید',newgroup:'تشکیل گفت‌وگوی گروهی',gtitle:'نام گروه',search:'جستجوی کاربر…',create:'ساخت گروه',save:'ذخیره',uname:'نام کاربر',photo:'انتخاب تصویر',bad_name:'نام کاربری باید ۳ تا ۲۰ حرف باشد (حرف، عدد یا _ بدون فاصله).',taken:'این نام گرفته شده است.',sess_exp:'نشست این حساب منقضی شده، دوباره وارد شو.',members:'عضو',noconf:'حساب ساخته شد ولی تأیید ایمیل در Supabase فعال است.',e_login:'ایمیل یا رمز عبور اشتباه است.',e_net:'اتصال به سرور برقرار نشد.',e_dup:'این ایمیل قبلاً ثبت‌نام کرده است. وارد شو.',e_rate:'تعداد تلاش‌ها زیاد شد. چند دقیقه بعد دوباره امتحان کن.',e_weak:'رمز عبور باید حداقل ۶ حرف باشد.',e_mail:'ایمیل معتبر نیست.',e_img:'تصویر معتبر نیست یا حجمش زیاد است.',user:'کاربر',gneed:'نام گروه و حداقل یک عضو را انتخاب کن.'},
en:{appname:'Messenger',authsub:'Sign in or create an account',login:'Sign in',signup:'Sign up',mkacc:'Create account',email:'Email',pass:'Password (min 6 chars)',uname_hint:'Username (3–20 letters, numbers or _)',cancel:'Cancel',msg_ph:'Write a message…',public:'Public chat',group:'Group',private:'Private chat',pub_sub:'All users',edited:'edited',editing:'Edit message',del_q:'Delete this message?',empty:'No messages yet.',profile:'Edit profile',dark:'Dark mode',light:'Light mode',lang:'Language',addacc:'Add account',logout:'Log out',newchat:'New chat',newgroup:'New group chat',gtitle:'Group name',search:'Search users…',create:'Create group',save:'Save',uname:'Display name',photo:'Choose photo',bad_name:'Username must be 3–20 letters, numbers or _ (no spaces).',taken:'This username is taken.',sess_exp:'This account session expired, sign in again.',members:'members',noconf:'Account created, but email confirmation is on in Supabase.',e_login:'Wrong email or password.',e_net:'Could not reach the server.',e_dup:'This email is already registered. Sign in.',e_rate:'Too many attempts. Try again in a few minutes.',e_weak:'Password must be at least 6 characters.',e_mail:'Invalid email address.',e_img:'Invalid image or file too large.',user:'User',gneed:'Enter a group name and pick at least one member.'}
};
const LS = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} } };
let lang = LS.get('lang') || 'fa';
let theme = LS.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
const t = k => T[lang][k] || k;
function applyUI(){
  const d = document.documentElement;
  d.lang = lang; d.dir = lang === 'fa' ? 'rtl' : 'ltr'; d.dataset.theme = theme;
  document.querySelector('meta[name=theme-color]').content = theme === 'dark' ? '#17212b' : '#eef6fd';
  document.querySelectorAll('[data-i]').forEach(e => e.textContent = t(e.dataset.i));
  document.querySelectorAll('[data-p]').forEach(e => e.placeholder = t(e.dataset.p));
  document.title = t('appname');
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function av(p, sz = 40, fb = '?'){
  const n = (p && p.username) || fb;
  if (p && p.avatar_url) return `<img class="av" style="width:${sz}px;height:${sz}px" src="${esc(p.avatar_url)}" alt="">`;
  let h = 0; for (const c of n) h = (h * 31 + c.codePointAt(0)) % 360;
  return `<div class="av" style="width:${sz}px;height:${sz}px;font-size:${sz*.45}px;background:hsl(${h},55%,52%)">${esc([...n][0].toUpperCase())}</div>`;
}
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
applyUI();
$('edcancel').innerHTML = ic('x', 18); $('fab').innerHTML = ic('edit', 24); document.querySelector('.logo').innerHTML = ic('plane', 30);
(async () => {
  try { await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'); }
  catch (e) { try { await loadScript('https://unpkg.com/@supabase/supabase-js@2'); } catch (e2) { $('auth').hidden = false; $('err').textContent = t('e_net'); return; } }
  start();
})();

function start(){
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let mode = 'login', me = null, mp = null, cur = null, convs = [], chan = null, poller = null, editing = null, lastId = 0;
  const P = {}, shown = new Map();
  const ACC = () => { try { return JSON.parse(LS.get('accounts') || '{}') || {}; } catch (e) { return {}; } };
  const saveAcc = o => LS.set('accounts', JSON.stringify(o));

  // نگه‌داشتن توکن حساب‌ها برای جابه‌جایی بین آنها
  let quiet = false;
  sb.auth.onAuthStateChange((ev, s) => {
    if (ev === 'SIGNED_OUT' && me && !quiet){ cleanup(); me = null; showAuth(false); return; }
    if (s && s.user){ const a = ACC(); a[s.user.id] = { ...a[s.user.id], email: s.user.email, access_token: s.access_token, refresh_token: s.refresh_token }; saveAcc(a); }
  });

  // ---------- مودال ----------
  const openSheet = (html, cls = '') => { $('sheet').onclick = null; $('sheet').className = 'sheet ' + cls; $('sheet').innerHTML = html; $('ov').hidden = false; return $('sheet'); };
  const closeSheet = () => { $('ov').hidden = true; $('sheet').innerHTML = ''; };
  $('ov').onclick = e => { if (e.target === $('ov')) closeSheet(); };

  // ---------- ورود ----------
  function setMode(m){
    mode = m;
    $('tabLogin').classList.toggle('on', m === 'login'); $('tabSignup').classList.toggle('on', m === 'signup');
    $('nameRow').hidden = m !== 'signup';
    $('authBtn').textContent = t(m === 'login' ? 'login' : 'mkacc'); $('err').textContent = '';
  }
  setMode('login');
  $('tabLogin').onclick = () => setMode('login'); $('tabSignup').onclick = () => setMode('signup');
  $('authBack').onclick = () => { $('auth').hidden = true; $('app').hidden = false; };
  function faError(msg){
    const m = (msg || '').toLowerCase();
    if (m.includes('invalid login')) return t('e_login');
    if (m.includes('already registered')) return t('e_dup');
    if (m.includes('rate limit')) return t('e_rate');
    if (m.includes('at least') || m.includes('weak')) return t('e_weak');
    if (m.includes('invalid') && m.includes('email')) return t('e_mail');
    if (m.includes('failed to fetch') || m.includes('network')) return t('e_net');
    return msg || '?';
  }
  $('authForm').onsubmit = async e => {
    e.preventDefault();
    const email = $('email').value.trim(), password = $('password').value, username = $('username').value.trim();
    $('err').textContent = '';
    if (mode === 'signup' && !/^[A-Za-z0-9_\u0600-\u06FF]{3,20}$/.test(username)){ $('err').textContent = t('bad_name'); return; }
    $('authBtn').disabled = true;
    try{
      if (mode === 'signup'){
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username } } });
        if (error) throw error;
        if (!data.session){ $('err').textContent = t('noconf'); return; }
        await enter(data.session.user);
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        await enter(data.user);
      }
    }catch(err){ $('err').textContent = faError(err.message); }
    finally{ $('authBtn').disabled = false; }
  };

  // ---------- پروفایل‌ها ----------
  async function loadProfiles(){
    const { data } = await sb.from('profiles').select('id,username,avatar_url');
    (data || []).forEach(p => P[p.id] = p);
  }
  const missed = {};
  async function ensureP(id){ if (P[id] || (missed[id] && Date.now() - missed[id] < 30000)) return; await loadProfiles(); if (!P[id]) missed[id] = Date.now(); }
  async function ensureProfile(){
    await loadProfiles();
    if (P[me.id]){ mp = P[me.id]; return true; }
    let name = me.user_metadata && me.user_metadata.username;
    for (let i = 0; i < 5; i++){
      if (!name) name = (prompt(t('uname')) || '').trim();
      if (!name) return false;
      const { error } = await sb.from('profiles').insert({ id: me.id, username: name });
      if (!error){ mp = P[me.id] = { id: me.id, username: name, avatar_url: null }; return true; }
      if (error.code === '23505'){ alert(t('taken')); name = null; continue; }
      alert(error.message); return false;
    }
    return false;
  }

  // ---------- فهرست گفت‌وگوها ----------
  const convTitle = c => c.type === 'public' ? t('public') : c.type === 'group' ? (c.title || t('group')) : ((P[c.other] || {}).username || t('user'));
  const convAv = (c, sz) => c.type === 'private' ? av(P[c.other], sz) : av({ username: convTitle(c) }, sz);
  const convSub = c => c.type === 'public' ? t('pub_sub') : c.type === 'group' ? t('group') : t('private');
  async function loadConvs(){
    const { data: mem } = await sb.from('conversation_members').select('conversation_id,conversations(id,type,title,created_at)').eq('user_id', me.id);
    const list = [{ id: PUB, type: 'public', created_at: '9' }];
    (mem || []).forEach(m => { const c = m.conversations; if (c && c.id !== PUB) list.push(c); });
    const pids = list.filter(c => c.type === 'private').map(c => c.id);
    if (pids.length){
      const { data } = await sb.from('conversation_members').select('conversation_id,user_id').in('conversation_id', pids).neq('user_id', me.id);
      for (const r of (data || [])){ list.find(c => c.id === r.conversation_id).other = r.user_id; await ensureP(r.user_id); }
    }
    convs = list.sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
    renderConvs();
  }
  function renderConvs(){
    const box = $('convs'); box.innerHTML = '';
    convs.forEach(c => {
      const d = document.createElement('div'); d.className = 'conv' + (cur && cur.id === c.id ? ' on' : '');
      d.innerHTML = convAv(c, 46) + `<div><b>${esc(convTitle(c))}</b><small>${esc(convSub(c))}</small></div>`;
      d.onclick = () => openConv(c); box.appendChild(d);
    });
  }
  function header(){
    if (!cur) return;
    $('hav').innerHTML = convAv(cur, 40); $('htitle').textContent = convTitle(cur); $('hsub').textContent = convSub(cur);
  }

  // ---------- پیام‌ها ----------
  async function openConv(c){
    cur = c; shown.clear(); lastId = 0; cancelEdit();
    $('app').classList.add('open'); if (innerWidth < 800 && !(history.state && history.state.chat)) history.pushState({ chat: 1 }, ''); header(); renderConvs();
    $('list').innerHTML = '';
    const { data, error } = await sb.from('messages').select('id,user_id,content,created_at,edited_at,conversation_id')
      .eq('conversation_id', c.id).order('id', { ascending: false }).limit(100);
    if (cur !== c) return;
    if (error){ $('list').innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
    if (!data.length) $('list').innerHTML = `<div class="empty" id="empty">${t('empty')}</div>`;
    if (data.some(m => !P[m.user_id])) await loadProfiles();
    if (cur !== c) return;
    for (const m of data.reverse()) addMessage(m, true);
    $('list').scrollTop = $('list').scrollHeight;
  }
  function addMessage(m, force){
    if (shown.has(m.id) || !cur || m.conversation_id !== cur.id) return;
    const list = $('list'), e = $('empty'); if (e) e.remove();
    const near = list.scrollHeight - list.scrollTop - list.clientHeight < 120;
    const mine = m.user_id === me.id;
    const div = document.createElement('div'); div.className = 'msg' + (mine ? ' mine' : ''); div.dataset.id = m.id;
    div.innerHTML = (!mine && cur.type !== 'private' ? `<div class="name">${esc((P[m.user_id] || {}).username || t('user'))}</div>` : '') +
      `<div class="txt" dir="auto"></div><div class="meta"><span class="ed"></span><span class="tm"></span>` +
      (mine ? `<button class="ib" data-a="e" aria-label="edit">${ic('edit', 14)}</button><button class="ib" data-a="d" aria-label="delete">${ic('trash', 14)}</button><span class="ck">${ic('check', 15)}</span>` : '') + `</div>`;
    shown.set(m.id, { el: div, m }); paint(m.id);
    list.appendChild(div); if (m.id > lastId) lastId = m.id;
    if (!force && (near || mine)) list.scrollTop = list.scrollHeight;
  }
  function paint(id){
    const { el, m } = shown.get(id);
    el.querySelector('.txt').textContent = m.content;
    el.querySelector('.ed').textContent = m.edited_at ? t('edited') : '';
    el.querySelector('.tm').textContent = new Date(m.created_at).toLocaleTimeString(lang === 'fa' ? 'fa-IR' : 'en-US', { hour: '2-digit', minute: '2-digit' });
  }
  function updateMsg(m){ const s = shown.get(m.id); if (s){ s.m = { ...s.m, ...m }; paint(m.id); } }
  function removeMsg(id){ const s = shown.get(id); if (s){ s.el.remove(); shown.delete(id); } }

  $('list').onclick = async e => {
    const b = e.target.closest('.ib'); if (!b) return;
    const id = +b.closest('.msg').dataset.id, s = shown.get(id);
    if (b.dataset.a === 'e'){
      editing = id; $('text').value = s.m.content; $('edtxt').textContent = t('editing') + ': ' + s.m.content;
      $('editbar').hidden = false; $('text').focus();
    } else if (confirm(t('del_q'))){
      const { error } = await sb.from('messages').delete().eq('id', id);
      if (error) alert(error.message); else removeMsg(id);
    }
  };
  function cancelEdit(){ editing = null; $('editbar').hidden = true; $('text').value = ''; }
  $('edcancel').onclick = cancelEdit;

  $('send').onsubmit = async e => {
    e.preventDefault();
    const content = $('text').value.trim(); if (!content || !cur) return;
    if (editing){ const o = shown.get(editing); if (o && o.m.content === content){ cancelEdit(); return; } }
    $('sendBtn').disabled = true;
    if (editing){
      const { data, error } = await sb.from('messages').update({ content }).eq('id', editing).select().single();
      $('sendBtn').disabled = false;
      if (error){ alert(error.message); return; }
      updateMsg(data); cancelEdit(); return;
    }
    const { data, error } = await sb.from('messages').insert({ user_id: me.id, conversation_id: cur.id, content }).select().single();
    $('sendBtn').disabled = false;
    if (error){ alert(error.message); return; }
    $('text').value = ''; addMessage(data); $('text').focus();
  };

  async function poll(){
    if (!cur) return;
    const c = cur;
    const { data } = await sb.from('messages').select('id,user_id,content,created_at,edited_at,conversation_id').eq('conversation_id', c.id).gt('id', lastId).order('id');
    for (const m of (data || [])){ if (cur !== c) return; await ensureP(m.user_id); addMessage(m); }
  }
  function subscribe(){
    chan = sb.channel('rt-' + me.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, async p => {
        if (p.eventType === 'DELETE') return removeMsg(p.old.id);
        const m = p.new; if (!cur || m.conversation_id !== cur.id) return;
        if (p.eventType === 'UPDATE') return updateMsg(m);
        await ensureP(m.user_id); addMessage(m);
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'conversation_members', filter: `user_id=eq.${me.id}` }, () => loadConvs())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, p => { if (p.new && p.new.id){ P[p.new.id] = p.new; if (p.new.id === me.id) mp = p.new; renderConvs(); header(); } })
      .subscribe(s => $('dot').classList.toggle('ok', s === 'SUBSCRIBED'));
    poller = setInterval(() => { if (!document.hidden) poll(); }, 4000);
  }

  // ---------- ورود به برنامه ----------
  function cleanup(){
    if (chan){ sb.removeChannel(chan); chan = null; }
    if (poller){ clearInterval(poller); poller = null; }
    shown.clear(); cur = null; lastId = 0; editing = null; $('editbar').hidden = true; $('list').innerHTML = '';
  }
  async function enter(user){
    cleanup(); me = user;
    if (!(await ensureProfile())){ quiet = true; await sb.auth.signOut({ scope: 'local' }); quiet = false; me = null; showAuth(false); return; }
    const a = ACC(); a[me.id] = { ...a[me.id], username: mp.username, avatar_url: mp.avatar_url }; saveAcc(a);
    $('auth').hidden = true; $('authBack').hidden = true; $('app').hidden = false; $('app').classList.remove('open'); closeSheet();
    await loadConvs(); subscribe();
    if (innerWidth >= 800) openConv(convs.find(c => c.id === PUB));
    $('password').value = '';
  }
  async function switchTo(id){
    const acc = ACC()[id]; closeSheet(); if (!acc) return;
    cleanup();
    const { data, error } = await sb.auth.setSession({ access_token: acc.access_token, refresh_token: acc.refresh_token });
    if (error || !data.user){ const a = ACC(); delete a[id]; saveAcc(a); alert(t('sess_exp')); if (me) return enter(me); return showAuth(false); }
    await enter(data.user);
  }
  function showAuth(canCancel){ closeSheet(); $('app').hidden = true; $('auth').hidden = false; $('authBack').hidden = !canCancel; setMode('login'); }
  async function logout(){
    const id = me.id; closeSheet();
    quiet = true; await sb.auth.signOut({ scope: 'local' }); quiet = false;
    const a = ACC(); delete a[id]; saveAcc(a);
    cleanup(); me = null;
    const next = Object.keys(a)[0];
    if (next) switchTo(next); else showAuth(false);
  }

  // ---------- منو ----------
    $('menuBtn').onclick = () => {
    const others = Object.entries(ACC()).filter(([id]) => id !== me.id);
    const s = openSheet(`<div class="mh">${av(mp, 56)}<b>${esc(mp.username)}</b><small>${esc(me.email)}</small></div>
      <button class="mi" data-m="profile">${ic('user', 22)} ${t('profile')}</button>
      <button class="mi" data-m="theme">${theme === 'dark' ? ic('sun', 22) + ' ' + t('light') : ic('moon', 22) + ' ' + t('dark')}</button>
      <div class="mi">${ic('globe', 22)} ${t('lang')}<span style="flex:1"></span><button class="btn sec" style="margin:0;width:auto;padding:6px 12px" data-lang="fa">فارسی</button><button class="btn sec" style="margin:0;width:auto;padding:6px 12px" data-lang="en">English</button></div>
      ${others.map(([id, a]) => `<button class="mi" data-acc="${id}">${av(a, 32, a.email || '?')}<span>${esc(a.username || a.email)}</span></button>`).join('')}
      <button class="mi" data-m="add">${ic('addu', 22)} ${t('addacc')}</button>
      <button class="mi" style="color:var(--danger)" data-m="out">${ic('out', 22)} ${t('logout')}</button>`, 'drawer');
    s.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.lang){ lang = b.dataset.lang; LS.set('lang', lang); applyUI(); setMode(mode); header(); renderConvs(); shown.forEach((_, id) => paint(id)); const em = $('empty'); if (em) em.textContent = t('empty'); closeSheet(); return; }
      if (b.dataset.acc) return switchTo(b.dataset.acc);
      const m = b.dataset.m;
      if (m === 'theme'){ theme = theme === 'dark' ? 'light' : 'dark'; LS.set('theme', theme); applyUI(); closeSheet(); }
      else if (m === 'profile') profileSheet();
      else if (m === 'add') showAuth(true);
      else if (m === 'out') logout();
    };
  };

  // ---------- ویرایش پروفایل ----------
  function profileSheet(){
    let blob = null;
    const s = openSheet(`<div style="text-align:center"><div id="pv" style="display:inline-block">${av(mp, 90)}</div></div>
      <input type="file" id="pf" accept="image/*" hidden><button class="btn sec" id="pick">${t('photo')}</button>
      <label>${t('uname')}</label><input id="pn" maxlength="20" value="${esc(mp.username)}">
      <div id="pe" style="color:var(--danger);font-size:13px;margin-top:8px"></div>
      <div class="row"><button class="btn" id="ps">${t('save')}</button><button class="btn sec" id="pc">${t('cancel')}</button></div>`);
    $('pick').onclick = () => $('pf').click();
    $('pc').onclick = closeSheet;
    $('pf').onchange = () => {
      const f = $('pf').files[0]; if (!f) return;
      $('pe').textContent = '';
      if (f.size > 15e6){ $('pe').textContent = t('e_img'); return; }
      const i = new Image();
      i.onload = () => {
        const c = document.createElement('canvas'); c.width = c.height = 256; const m = Math.min(i.width, i.height);
        c.getContext('2d').drawImage(i, (i.width - m) / 2, (i.height - m) / 2, m, m, 0, 0, 256, 256); URL.revokeObjectURL(i.src);
        c.toBlob(b => { blob = b; $('pv').innerHTML = `<img class="av" style="width:90px;height:90px" src="${c.toDataURL('image/jpeg', .85)}">`; }, 'image/jpeg', .85);
      };
      i.onerror = () => { $('pe').textContent = t('e_img'); };
      i.src = URL.createObjectURL(f);
    };
    $('ps').onclick = async () => {
      const name = $('pn').value.trim();
      if (!/^[A-Za-z0-9_\u0600-\u06FF]{3,20}$/.test(name)){ $('pe').textContent = t('bad_name'); return; }
      $('ps').disabled = true;
      try{
        let url = mp.avatar_url;
        if (blob){
          const path = `${me.id}/${Date.now()}.jpg`;
          const { error } = await sb.storage.from('avatars').upload(path, blob, { contentType: 'image/jpeg' });
          if (error) throw error;
          url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
        }
        const { error } = await sb.from('profiles').update({ username: name, avatar_url: url }).eq('id', me.id);
        if (error) throw error;
        if (blob && mp.avatar_url){ const o = mp.avatar_url.split('/avatars/')[1]; if (o) sb.storage.from('avatars').remove([o]); }
        mp = P[me.id] = { ...mp, username: name, avatar_url: url };
        const a = ACC(); a[me.id] = { ...a[me.id], username: name, avatar_url: url }; saveAcc(a);
        renderConvs(); header(); closeSheet();
      }catch(err){ $('pe').textContent = err.code === '23505' ? t('taken') : err.message; $('ps').disabled = false; }
    };
  }

  // ---------- گفت‌وگوی جدید ----------
  $('fab').onclick = () => {
    let gmode = false; const picked = new Set();
    openSheet(`<div class="tabs"><button id="nt1" class="on">${t('private')}</button><button id="nt2">${t('newgroup')}</button></div>
      <div id="gt" hidden><input id="gtitle" maxlength="40" placeholder="${t('gtitle')}"><div style="height:8px"></div></div>
      <input id="q" placeholder="${t('search')}"><div id="ul" style="margin-top:8px"></div>
      <button class="btn" id="mk" hidden>${t('create')}</button>`);
    const draw = () => {
      const q = $('q').value.trim().toLowerCase();
      $('ul').innerHTML = Object.values(P).filter(p => p.id !== me.id && p.username.toLowerCase().includes(q)).map(p =>
        `<label class="ur" style="margin:0;font-size:15px;color:var(--text)" data-u="${p.id}">${gmode ? `<input type="checkbox" ${picked.has(p.id) ? 'checked' : ''}>` : ''}${av(p, 38)}<span>${esc(p.username)}</span></label>`).join('');
    };
    const setG = g => { gmode = g; $('nt1').classList.toggle('on', !g); $('nt2').classList.toggle('on', g); $('gt').hidden = !g; $('mk').hidden = !g; draw(); };
    $('nt1').onclick = () => setG(false); $('nt2').onclick = () => setG(true); $('q').oninput = draw; draw();
    loadProfiles().then(() => { if ($('ul')) draw(); });
    $('ul').onclick = async e => {
      const r = e.target.closest('[data-u]'); if (!r) return;
      const id = r.dataset.u;
      if (gmode){ if (e.target.tagName !== 'INPUT'){ e.preventDefault(); } const cb = r.querySelector('input'); if (e.target.tagName !== 'INPUT') cb.checked = !cb.checked; cb.checked ? picked.add(id) : picked.delete(id); return; }
      e.preventDefault();
      const { data, error } = await sb.rpc('start_private_chat', { other: id });
      if (error) return alert(error.message);
      await done(data);
    };
    $('mk').onclick = async () => {
      const title = $('gtitle').value.trim();
      if (!title || !picked.size) return alert(t('gneed'));
      const { data, error } = await sb.rpc('create_group', { gtitle: title, members: [...picked] });
      if (error) return alert(error.message);
      await done(data);
    };
    async function done(cid){ closeSheet(); await loadConvs(); const c = convs.find(x => x.id === cid); if (c) openConv(c); }
  };

  function closeConv(){ $('app').classList.remove('open'); cur = null; renderConvs(); }
  $('back').onclick = () => { if (history.state && history.state.chat) history.back(); else closeConv(); };
  addEventListener('popstate', () => { if ($('app').classList.contains('open')) closeConv(); });

  // ---------- شروع: اگر قبلاً وارد شده بود ----------
  document.addEventListener('visibilitychange', () => { if (!document.hidden && me) poll(); });
  sb.auth.getSession().then(({ data }) => { if (data.session) enter(data.session.user); else $('auth').hidden = false; }).catch(() => { $('auth').hidden = false; });
}
</script>
</body>
</html>
