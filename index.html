<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<title>پیام‌رسان</title>
<style>
:root{--brand:#3390ec;--bg:#fff;--card:#fff;--hd:#fff;--line:#e6e9ec;--mine:#eeffde;--other:#fff;--text:#0f1419;--muted:#707579;--danger:#e53935;--inp:#f1f3f4;--blend:normal;--cbg:#dbeafb;--nl:38%}
[data-theme=dark]{--brand:#6ab3f3;--hd:#17212b;--bg:#0e1621;--card:#17212b;--line:#0e1621;--mine:#2b5278;--other:#182533;--text:#f5f5f5;--muted:#7f91a4;--inp:#0e1621;--blend:multiply;--cbg:#1b2733;--nl:70%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:Vazirmatn,Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:var(--inp);color:var(--text);outline:none}
input:focus{border-color:var(--brand)}
input.ltr{direction:ltr;text-align:left}
input[type=checkbox]{width:22px;height:22px;padding:0;accent-color:var(--brand);flex:none}
svg{flex-shrink:0}
.btn{width:100%;margin-top:14px;padding:12px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:bold;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:var(--inp);color:var(--text);border:1px solid var(--line)}
.btn.dng{color:var(--danger)}
.btn:disabled{opacity:.6}
.ib{border:0;background:none;color:var(--muted);padding:0 2px;display:inline-flex;align-items:center;justify-content:center}
.flip{display:block}[dir=rtl] .flip{transform:scaleX(-1)}
.av{border-radius:50%;object-fit:cover;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0}
label{display:block;font-size:13px;margin:12px 0 5px;color:var(--muted)}
.err{margin-top:10px;color:var(--danger);font-size:13px;text-align:center;min-height:18px}
.sub{margin:0 0 16px;text-align:center;color:var(--muted);font-size:13px}

/* ورود */
#auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);width:100%;max-width:380px;border-radius:18px;padding:24px;box-shadow:0 6px 24px rgba(0,0,0,.1)}
.card h1{margin:0 0 4px;font-size:22px;color:var(--brand);text-align:center}
.logo{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center}
.tabs{display:flex;background:var(--inp);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--brand);font-weight:bold;box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* قالب */
#app{height:100dvh;display:flex}
#side{width:100%;display:flex;flex-direction:column;background:var(--card);position:relative;min-width:0}
#room{display:none;flex:1;flex-direction:column;min-width:0;background:var(--bg)}
#app.open #side{display:none}#app.open #room{display:flex}
.hd{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--hd);border-bottom:1px solid var(--line);min-height:56px}
.hd .t{flex:1;min-width:0}.hd .t b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd .t small{color:var(--muted);font-size:12px;display:flex;align-items:center}
.hd button.i{background:none;border:0;color:var(--muted);width:38px;height:38px;display:flex;align-items:center;justify-content:center}
#rhd .t{cursor:pointer}

/* لیست چت‌ها */
#convs{flex:1;overflow-y:auto}
.conv{display:flex;align-items:center;gap:12px;padding:9px 14px;cursor:pointer}
.conv:active,.conv.on{background:var(--inp)}
.conv .cm{flex:1;min-width:0}
.conv .r1,.conv .r2{display:flex;align-items:center;gap:8px}
.conv .r1 b{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .tm{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:2px;flex:none}
.conv .tm .ck{color:var(--brand);display:inline-flex}
.conv .pv{flex:1;min-width:0;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:20px}
.conv .bd{background:var(--brand);color:#fff;border-radius:11px;min-width:22px;height:22px;padding:0 6px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
[data-theme=dark] .conv .bd{color:#0e1621}
#fab{position:absolute;bottom:20px;inset-inline-end:20px;width:56px;height:56px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(51,144,236,.45)}
[data-theme=dark] #fab{color:#0e1621}

/* پیام‌ها */

.sep{align-self:center;margin:10px 0 6px;padding:3px 12px;border-radius:12px;background:rgba(0,0,0,.28);color:#fff;font-size:12px;direction:rtl}
.row{display:flex;align-items:flex-end;gap:6px;margin-top:2px}
.row.gs{margin-top:8px}
.row.m{justify-content:flex-end}
.avc{width:34px;flex:none}
.row:not(.ge) .avc>*{visibility:hidden}
.msg{max-width:min(82%,520px);min-width:64px;padding:6px 10px 5px;border-radius:16px;background:var(--other);box-shadow:0 1px 1.5px rgba(0,0,0,.12);overflow-wrap:anywhere;direction:rtl;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative}
[dir=ltr] .msg{direction:ltr}
.row.m .msg{background:var(--mine)}
.row.o:not(.gs) .msg{border-top-left-radius:5px}
.row.o:not(.ge) .msg{border-bottom-left-radius:5px}
.row.o.ge .msg{border-bottom-left-radius:4px}
.row.m:not(.gs) .msg{border-top-right-radius:5px}
.row.m:not(.ge) .msg{border-bottom-right-radius:5px}
.row.m.ge .msg{border-bottom-right-radius:4px}
.row.flash .msg{outline:2px solid var(--brand)}
.msg .name{font-size:13px;font-weight:600;margin-bottom:1px}
.row:not(.gs) .name,.row.m .name,#list[data-t=private] .name{display:none}
.msg .rq{border-inline-start:3px solid var(--brand);padding:2px 8px;margin:2px 0 4px;background:rgba(51,144,236,.12);border-radius:4px 8px 8px 4px;font-size:13px;cursor:pointer;min-width:120px}
.msg .rq b{display:block;color:var(--brand);font-size:12px;font-weight:600}
.msg .rq span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.msg .img{margin:2px -6px 4px;border-radius:12px;overflow:hidden;min-height:140px;background:rgba(0,0,0,.08);cursor:pointer}
.msg .img img{display:block;width:100%;max-height:340px;object-fit:cover}
.msg .fil{display:flex;align-items:center;gap:10px;padding:4px 0 6px;color:inherit;text-decoration:none;min-width:190px}
.msg .fil .fi{width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
[data-theme=dark] .msg .fil .fi{color:#0e1621}
.msg .fil .fm{min-width:0}.msg .fil b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.msg .fil small{display:block;font-size:12px;color:var(--muted);direction:ltr;text-align:start}
.msg.hasimg{width:300px;max-width:82%}
.msg .body{display:flex;flex-wrap:wrap;align-items:flex-end;gap:0 10px}
.msg .txt{font-size:15px;line-height:1.7;white-space:pre-wrap;min-width:0}
.msg .meta{margin-inline-start:auto;display:flex;gap:4px;align-items:center;font-size:11px;color:var(--muted);height:18px;white-space:nowrap}
.row.m .meta .ck{color:var(--brand);display:inline-flex}
.empty{direction:rtl;background:rgba(0,0,0,.28);color:#fff;padding:6px 14px;border-radius:14px;margin:auto;font-size:14px}
#down{position:absolute;bottom:12px;inset-inline-end:12px;width:42px;height:42px;border-radius:50%;border:0;background:var(--card);color:var(--muted);box-shadow:0 2px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
#dcnt{position:absolute;top:-6px;inset-inline-start:-2px;background:var(--brand);color:#fff;border-radius:10px;min-width:20px;height:20px;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 5px}
#bar{display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--card);border-top:1px solid var(--line);color:var(--brand)}
#bar .bt{flex:1;min-width:0;border-inline-start:2px solid var(--brand);padding-inline-start:8px}
#bar .bt b{display:block;font-size:13px}#bar .bt span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#send{display:flex;align-items:center;gap:6px;padding:6px 8px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
#send .pill{flex:1;display:flex;align-items:center;background:var(--inp);border-radius:22px;padding:0 6px;min-width:0}
#send .pill input{border:0;background:transparent;padding:11px 8px;font-size:16px}
#attach{width:40px;height:40px;color:var(--muted)}
#sendBtn{width:44px;height:44px;border:0;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
[data-theme=dark] #sendBtn{color:#0e1621}
#ro{padding:14px;text-align:center;background:var(--card);border-top:1px solid var(--line);color:var(--muted);font-size:14px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#f4b400;margin-inline-end:5px}.dot.ok{background:#31b545}

/* پنجره‌ها */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:420px;max-height:88dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.sheet.actions{padding:6px 0}
.drawer{align-self:stretch;margin-inline-end:auto;border-radius:0;width:290px;max-height:none;padding:0}
.mi{color:var(--text);display:flex;align-items:center;gap:16px;width:100%;padding:13px 16px;border:0;background:none;text-align:start;font-size:15px}
.mi:active{background:var(--inp)}.mi>svg{color:var(--muted)}
.mi.dng,.mi.dng>svg{color:var(--danger)}
.mh{padding:20px 16px;background:linear-gradient(135deg,#6bb7f6,#3390ec);color:#fff;padding-top:max(20px,env(safe-area-inset-top))}
.mh b{display:block;margin-top:8px}.mh small{opacity:.85;direction:ltr;display:block;text-align:start}
.row2{display:flex;gap:8px}.row2 .btn{margin-top:8px}
.ur{display:flex;align-items:center;gap:12px;padding:8px 4px;cursor:pointer;font-size:15px}
.ur .own{margin-inline-start:auto;color:var(--brand);font-size:12px}
.ur .sel{margin-inline-start:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff}
.ur.on .sel{background:var(--brand);border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{display:flex;align-items:center;gap:4px;background:var(--inp);border-radius:16px;padding:3px 10px 3px 6px;font-size:13px;cursor:pointer}
.hint{color:var(--muted);font-size:13px;text-align:center;padding:14px 8px}
.sw{display:flex;align-items:center;gap:12px;margin:14px 0 0;color:var(--text);font-size:15px}
.sw span{flex:1}.sw small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.prev{width:100%;max-height:50dvh;object-fit:contain;border-radius:12px;background:#000;display:block;margin-bottom:10px}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:flex;align-items:center;justify-content:center}
#viewer img{max-width:100%;max-height:100%;object-fit:contain}
@media(min-width:800px){#side{width:360px;display:flex!important;border-inline-end:1px solid var(--line);flex:none}#room{display:flex}.bk{display:none}.ov{align-items:center}.sheet{border-radius:18px}.drawer{border-radius:0;align-self:stretch}}

    $('ps').onclick = async () => {
      const name = $('pn').value.trim();
      if (!/^[A-Za-z0-9_؀-ۿ]{3,20}$/.test(name)){ $('pe').textContent = t('bad_name'); return; }
      $('ps').disabled = true;
      try{
        let url = mp.avatar_url;
        if (blob){
          const path = `${me.id}/${Date.now()}.jpg`;
          const { error } = await sb.storage.from('avatars').upload(path, blob, { contentType: 'image/jpeg' });
          if (error) throw error;
          url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
        }
        const { error } = await sb.from('profiles').update({ username: name, avatar_url: url }).eq('id', me.id);
        if (error) throw error;
        if (blob && mp.avatar_url){ const o = mp.avatar_url.split('/avatars/')[1]; if (o) sb.storage.from('avatars').remove([o]); }
        mp = P[me.id] = { ...mp, username: name, avatar_url: url };
        const a = ACC(); a[me.id] = { ...a[me.id], username: name, avatar_url: url }; saveAcc(a);
        renderConvs(); header(); closeSheet();
      }catch(err){ $('pe').textContent = err.code === '23505' ? t('taken') : err.message; $('ps').disabled = false; }
    };
  }

  // ---------- گفت‌وگوی جدید / افزودن عضو (جستجو با نام کاربری) ----------
  $('fab').onclick = () => newChatSheet('private');
  function newChatSheet(kind, gid){
    let gmode = kind !== 'private', results = [], searched = '', timer = null;
    const picked = new Map();
    openSheet(`${kind === 'add' ? `<b style="display:block;margin-bottom:10px">${t('add_member')}</b>` : `<div class="tabs"><button id="nt1" class="${gmode ? '' : 'on'}">${t('private')}</button><button id="nt2" class="${gmode ? 'on' : ''}">${t('newgroup')}</button></div>`}
      <div id="gt" ${kind === 'group' || kind === 'private' && gmode ? '' : 'hidden'}><input id="gtitle" maxlength="40" placeholder="${t('gtitle')}"><label class="sw"><span><b>${t('own_new')}</b><small>${t('only_owner_d')}</small></span><input type="checkbox" id="gonly"></label><div style="height:8px"></div></div>
      <div id="chips" class="chips"></div>
      <input id="q" placeholder="${t('search')}" autocomplete="off" autocapitalize="off">
      <div id="ul" style="margin-top:6px"></div>
      <button class="btn" id="mk" ${gmode ? '' : 'hidden'}>${kind === 'add' ? t('add_member') : t('create')}</button>`);
    const contacts = () => convs.filter(c => c.type === 'private' && P[c.other]).map(c => P[c.other]);
    function chips(){
      $('chips').innerHTML = [...picked.values()].map(p => `<span class="chip" data-u="${p.id}">${esc(p.username)} ${ic('x', 14)}</span>`).join('');
    }
    function draw(){
      const q = $('q').value.trim();
      let list, hint = '';
      if (q.length >= 3){ list = results; if (searched === q && !list.length) hint = `<div class="hint">${t('no_result')}</div>`; }
      else { list = gmode ? contacts() : []; if (!list.length) hint = `<div class="hint">${t('search_hint')}</div>`; else hint = `<div class="hint" style="padding:6px 4px;text-align:start">${t('contacts')}</div>`; }
      $('ul').innerHTML = hint + list.map(p => `<div class="ur${picked.has(p.id) ? ' on' : ''}" data-u="${p.id}">${av(p, 40)}<span>${esc(p.username)}</span>${gmode ? `<span class="sel">${picked.has(p.id) ? ic('check', 14) : ''}</span>` : ''}</div>`).join('');
      chips();
    }
    function setG(g){ gmode = g; $('nt1').classList.toggle('on', !g); $('nt2').classList.toggle('on', g); $('gt').hidden = !g; $('mk').hidden = !g; draw(); }
    if (kind !== 'add'){ $('nt1').onclick = () => setG(false); $('nt2').onclick = () => setG(true); $('gt').hidden = !gmode; }
    $('q').oninput = () => {
      clearTimeout(timer); const q = $('q').value.trim();
      if (q.length < 3){ results = []; searched = ''; draw(); return; }
      timer = setTimeout(async () => {
        const { data } = await sb.rpc('find_user', { q });
        if ($('q') && $('q').value.trim() === q){ results = data || []; searched = q; draw(); }
      }, 300);
    };
    $('chips').onclick = e => { const c = e.target.closest('[data-u]'); if (c){ picked.delete(c.dataset.u); draw(); } };
    $('ul').onclick = async e => {
      const r = e.target.closest('[data-u]'); if (!r) return;
      const id = r.dataset.u, p = results.find(x => x.id === id) || P[id]; if (!p) return;
      if (gmode){ if (picked.has(id)) picked.delete(id); else picked.set(id, p); draw(); return; }
      const { data, error } = await sb.rpc('start_private_chat', { other: id });
      if (error) return fail(error);
      await finish(data);
    };
    $('mk').onclick = async () => {
      if (kind === 'add'){
        if (!picked.size) return;
        const { error } = await sb.rpc('add_group_members', { cid: gid, members: [...picked.keys()] });
        if (error) return fail(error);
        closeSheet(); await loadProfiles(); const c = convs.find(x => x.id === gid); if (c){ c.count = 0; if (cur === c){ const r = await sb.from('conversation_members').select('user_id', { count: 'exact', head: true }).eq('conversation_id', gid); if (r && r.count) c.count = r.count; header(); } }
        return;
      }
      const title = $('gtitle').value.trim();
      if (!title || !picked.size) return alert(t('gneed'));
      const { data, error } = await sb.rpc('create_group', { gtitle: title, members: [...picked.keys()] });
      if (error) return fail(error);
      if ($('gonly') && $('gonly').checked){
        const r = await sb.from('conversations').update({ only_owner_can_post: true }).eq('id', data);
        if (r.error) fail(r.error);
      }
      await finish(data);
    };
    async function finish(cid){ closeSheet(); await loadConvs(); const c = convs.find(x => x.id === cid); if (c) openConv(c); }
    draw();
  }

  // ---------- تنظیمات گروه ----------
  $('htitlebox').onclick = () => { if (cur && cur.type === 'group') groupInfo(); };
  async function deleteGroup(c){
    if (!confirm(t('del_group_q'))) return;
    await removeChatImages(c.id);
    const { error } = await sb.from('conversations').delete().eq('id', c.id);
    if (error) return fail(error);
    closeSheet(); removeConv(c.id);
  }
  async function leaveGroup(c){
    if (!confirm(t('leave_q'))) return;
    const { error } = await sb.from('conversation_members').delete().eq('conversation_id', c.id).eq('user_id', me.id);
    if (error) return fail(error);
    closeSheet(); removeConv(c.id);
  }
  $('more').onclick = () => {
    const c = cur; if (!c || c.type !== 'group') return; const owner = c.created_by === me.id;
    const items = [['info', 'users', t('settings')]];
    if (owner){ items.push(['add', 'addu', t('add_member')]); items.push(['del', 'trash', t('del_group'), 'dng']); }
    else items.push(['leave', 'out', t('leave'), 'dng']);
    const sh = openSheet(items.map(([a, i, l, k]) => `<button class="mi ${k || ''}" data-act="${a}">${ic(i, 22)} ${l}</button>`).join(''), 'actions');
    sh.onclick = e => {
      const b = e.target.closest('button'); if (!b) return; const a = b.dataset.act;
      if (a === 'info'){ closeSheet(); groupInfo(); }
      else if (a === 'add'){ closeSheet(); newChatSheet('add', c.id); }
      else if (a === 'del') deleteGroup(c);
      else if (a === 'leave') leaveGroup(c);
    };
  };
  async function removeChatImages(cid){
    try{
      for (const b of ['chat-images', 'chat-files']){
        const { data } = await sb.storage.from(b).list(cid, { limit: 1000 });
        const paths = (data || []).map(o => cid + '/' + o.name);
        if (paths.length) await sb.storage.from(b).remove(paths);
      }
    }catch(e){}
  }
  async function groupInfo(){
    const c = cur; if (!c || c.type !== 'group') return;
    const owner = c.created_by === me.id;
    const { data: mem } = await sb.from('conversation_members').select('user_id').eq('conversation_id', c.id);
    await loadProfiles();
    const ids = (mem || []).map(x => x.user_id);
    const rows = ids.map(id => { const p = P[id] || { username: t('user') }; return `<div class="ur">${av(p, 40)}<span>${esc(p.username)}</span>${id === c.created_by ? `<span class="own">${t('owner')}</span>` : ''}</div>`; }).join('');
    openSheet(`<div style="text-align:center">${av({ username: convTitle(c) }, 80)}</div>
      ${owner ? `<label>${t('rename')}</label><input id="gname" maxlength="40" value="${esc(c.title || '')}">
        <label class="sw"><span><b>${t('only_owner')}</b><small>${t('only_owner_d')}</small></span><input type="checkbox" id="gown" ${c.only_owner_can_post ? 'checked' : ''}></label>
        <div id="ge" class="err"></div>
        <button class="btn" id="gsave">${t('save')}</button>
        <button class="btn sec" id="gadd">${ic('addu', 18)} ${t('add_member')}</button>`
        : `<h3 style="text-align:center;margin:10px 0 4px">${esc(convTitle(c))}</h3>${c.only_owner_can_post ? `<p class="sub">${t('owner_only')}</p>` : ''}`}
      ${owner ? `<button class="btn sec dng" id="gdel">${ic('trash', 18)} ${t('del_group')}</button>` : `<button class="btn sec dng" id="gleave">${ic('out', 18)} ${t('leave')}</button>`}
      <label>${ids.length.toLocaleString(loc())} ${t('members')}</label>${rows}`);
    if (owner){
      $('gsave').onclick = async () => {
        const title = $('gname').value.trim();
        if (!title){ $('ge').textContent = t('gneed'); return; }
        $('gsave').disabled = true;
        const { data, error } = await sb.from('conversations').update({ title, only_owner_can_post: $('gown').checked }).eq('id', c.id).select('id,title,only_owner_can_post').single();
        $('gsave').disabled = false;
        if (error){ $('ge').textContent = error.message; return; }
        c.title = data.title; c.only_owner_can_post = data.only_owner_can_post; renderConvs(); header(); setComposer(); closeSheet();
      };
      $('gadd').onclick = () => newChatSheet('add', c.id);
      $('gdel').onclick = () => deleteGroup(c);
    } else {
      $('gleave').onclick = () => leaveGroup(c);
    }
  }

  // ---------- شروع ----------
  document.addEventListener('visibilitychange', () => { if (!document.hidden && me && cur){ poll(); markRead(); } });
  sb.auth.getSession().then(({ data }) => { if (data.session) enter(data.session.user); else $('auth').hidden = false; }).catch(() => { $('auth').hidden = false; });
}
</script>
</body>
</html>
